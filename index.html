<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="QUIZ">
    <meta name="apple-mobile-web-app-title" content="QUIZ">

    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz por Fases</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    background-color: #0f172a;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.6), rgba(2, 6, 23, 0.95));
    z-index: -1;
}

.container {
    width: 100%;
    max-width: 480px;
    padding: 20px;
    color: white;
    z-index: 1;
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #fff, #facc15);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(250, 204, 21, 0.4));
}

/* Modal de Confirmação Customizado */
#modal-confirmacao {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    border-radius: 24px;
    z-index: 100;
    text-align: center;
    border: 1px solid rgba(250, 204, 21, 0.3);
}

.modal-btns {
    display: flex;
    gap: 10px;
    width: 100%;
}

.btn-confirmar { background: #10b981; color: white; border-radius: 12px; }
.btn-cancelar { background: #ef4444; color: white; border-radius: 12px; }

.logo-quiz {
    width: 120px;
    height: 120px;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px auto;
    border-radius: 50%; 
    border: 3px solid #facc15;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
    animation: logoPulse 2s infinite ease-in-out;
}

@keyframes logoPulse {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
    50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(250, 204, 21, 0.7); }
    100% { transform: scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
}

.counter {
    text-align: center;
    margin-bottom: 15px;
    font-size: 13px;
    font-weight: bold;
    color: #94a3b8;
    text-transform: uppercase;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.result-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 15px;
    margin: 15px 0;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
}

.stat-label { color: #94a3b8; font-size: 14px; }
.stat-value { font-weight: bold; font-size: 18px; }

.btn-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
}

.coin-display {
    color: #facc15;
    text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
}

.coin-effect {
    position: fixed;
    color: #facc15;
    font-weight: bold;
    font-size: 24px;
    pointer-events: none;
    z-index: 1000;
    animation: moveUp 1s ease-out forwards;
    text-shadow: 0 0 10px rgba(0,0,0,1);
}

@keyframes moveUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100px); opacity: 0; }
}

.card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 25px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.fase-info {
    text-align: center;
    margin-bottom: 15px;
    font-weight: 800;
    color: #facc15;
    background: rgba(250, 204, 21, 0.1);
    border: 1px solid rgba(250, 204, 21, 0.3);
    padding: 8px 16px;
    border-radius: 50px;
    display: inline-block;
    font-size: 12px;
}

.timer {
    color: #facc15;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
    font-family: monospace;
    font-size: 18px;
}

h2 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.4;
    font-weight: 600;
}

button {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-voltar {
    background: rgba(255, 255, 255, 0.05);
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    width: auto;
}

.option {
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: left;
    padding-left: 20px;
}

.correct {
    background: linear-gradient(135deg, #059669, #10b981) !important;
    color: white;
}

.wrong {
    background: linear-gradient(135deg, #dc2626, #ef4444) !important;
    color: white;
}

.action {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    text-transform: uppercase;
}

/* Estilos do Ranking */
.rank-item {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    margin: 8px 0;
    border-radius: 12px;
    border-left: 4px solid #facc15;
}
.rank-pos { font-weight: bold; color: #facc15; margin-right: 8px; }
input#nomeRanking {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(250, 204, 21, 0.5);
    background: rgba(15, 23, 42, 0.8);
    color: white;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 16px;
}

body { padding-bottom: 80px; }

@media (max-width: 500px) {
    .container { padding: 15px; }
    .card { padding: 20px; border-radius: 20px; }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎯 Teste Seu QI</h1>

    <div class="counter" id="hud" style="display:none;">
        <div>⏱ <span id="globalTime">0</span>s</div>
        <div class="coin-display">💰 <span id="coinCount">0</span></div>
    </div>

    <div id="quiz" class="card">
        <div id="menu-inicial">
            <img src="logo.png" alt="Logo" class="logo-quiz">
            <h2 style="margin-bottom: 20px;">Teste seu conhecimento e avance de fase</h2>
            <button class="btn-categoria" onclick="escolherCategoria('religiao')">📖 Religião</button>
            <button class="btn-categoria" onclick="escolherCategoria('curiosidades')">💡 Curiosidades</button>
            <button class="btn-categoria" onclick="escolherCategoria('Futebol')">⚽ Futebol</button>
            <button class="action" style="background: #6366f1; margin-top: 15px;" onclick="verRanking()">🏆 Ranking Global</button>
        </div>
    </div>
</div>

<script>
const URL_RANKING = "https://script.google.com/macros/s/AKfycbwh_l4xRcnvC6rTlwzHsnlvRijm8j9pfVVd0YVnut0zQcwA_uL9_w82x_9aWx6june30Q/exec";

const linksCategorias = {
    religiao: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbLKo7OrAuSAlaKkHIEfg2q1Vl2i-b5Jlcpm6j3-SFm68wdcAwBMWyY5uWmtbo3yIy378ApaCrgzXn/pub?gid=2042818854&single=true&output=csv",
    curiosidades: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNuwwnAKhYDnsELndwC4tmIIGnRTwWThML03j-Viw2kwWtkylWT035Hj2amdB7j2Hcj0KfkS93Qi27/pub?gid=186362181&single=true&output=csv",
    Futebol: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzToXmaCiC0tqGFS3Ejc_kHeW1JI9TRvm94HGAFau_AFwJSxdpGUsu2UXe4LMTtoFLP0E-cSw9G1RL/pub?gid=905938198&single=true&output=csv"
};

let urlFases = "";
let fases = [];
let faseAtual = 0;
let perguntas = [];
let atual = 0;
let pontos = 0;
let erros = 0;
let totalCoins = 0;
let listaDeErrosTexto = [];
let tempo = 15;
let timer;
let globalTime = 0;
let categoriaAtualNome = ""; // AJUSTE: Variável para armazenar a categoria

function escolherCategoria(cat) {
    categoriaAtualNome = cat.toUpperCase(); // AJUSTE: Armazena o nome da categoria selecionada
    urlFases = linksCategorias[cat];
    document.getElementById("hud").style.display = "flex";
    setInterval(() => {
        globalTime++;
        document.getElementById("globalTime").innerText = globalTime;
    }, 1000);
    carregarFases();
}

function carregarFases() {
    document.getElementById("quiz").innerHTML = "Carregando fases...";
    fetch(urlFases).then(r => r.text()).then(data => {
        const linhas = data.trim().split("\n").slice(1);
        fases = linhas.map(l => {
            const c = l.split(",");
            return { url: c[1], img: c[2] };
        });
        carregarFase();
    });
}

function carregarFase() {
    atual = 0;
    pontos = 0;
    erros = 0;
    listaDeErrosTexto = [];
    const fase = fases[faseAtual];
    const img = fase.img?.trim();
    if (img && (img.includes(".jpg") || img.includes(".png") || img.includes(".jpeg") || img.includes(".webp"))) {
        document.body.style.backgroundImage = `url('${img}')`;
    } else {
        document.body.style.backgroundImage = `url('https://images.unsplash.com/photo-1529070538774-1843cb3265df')`;
    }
    fetch(fase.url).then(r => r.text()).then(data => {
        const linhas = data.trim().split("\n").slice(1);
        perguntas = linhas.map(l => {
            const c = l.split(",");
            return { pergunta: c[0], resposta: c[1], opcoes: shuffle([c[1], c[2], c[3], c[4]]) };
        });
        mostrar();
    });
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function iniciarTimer() {
    clearInterval(timer);
    tempo = 15;
    document.getElementById("timer").innerText = tempo;
    timer = setInterval(() => {
        tempo--;
        document.getElementById("timer").innerText = tempo;
        if (tempo <= 0) {
            clearInterval(timer);
            erros++;
            listaDeErrosTexto.push(perguntas[atual].pergunta);
            atual++;
            mostrar();
        }
    }, 1000);
}

function animaMoedas(x, y) {
    const el = document.createElement("div");
    el.className = "coin-effect";
    el.innerText = "+10 💰";
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function mostrar() {
    if (atual >= perguntas.length) { fim(); return; }
    const totalFases = fases.length;
    const faseNum = faseAtual + 1;
    const q = perguntas[atual];

    document.getElementById("quiz").innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button class="btn-voltar" onclick="location.reload()">⬅ Voltar</button>
            <div class="fase-info">📌 Fase ${faseNum} / ${totalFases}</div>
        </div>
        <div class="timer">⏳ Tempo: <span id="timer">15</span>s</div>
        <h2>${q.pergunta}</h2>
        <div id="opcoes"></div>
    `;

    iniciarTimer();
    const div = document.getElementById("opcoes");

    q.opcoes.forEach(op => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = op;
        btn.onclick = (e) => {
            clearInterval(timer);
            document.querySelectorAll("button").forEach(b => b.disabled = true);
            if (op === q.resposta) {
                btn.classList.add("correct");
                pontos++;
                totalCoins += 10;
                document.getElementById("coinCount").innerText = totalCoins;
                animaMoedas(e.clientX, e.clientY);
            } else {
                btn.classList.add("wrong");
                erros++;
                listaDeErrosTexto.push(q.pergunta);
            }
            setTimeout(() => { atual++; mostrar(); }, 800);
        };
        div.appendChild(btn);
    });
}

function fim() {
    let html = "";
    const totalGanhos = pontos * 10;

    if (erros === 0) {
        html = `
        <div style="text-align:center; animation: fadeIn 0.5s ease;">
            <div style="font-size:60px; margin-bottom: 10px; filter: drop-shadow(0 0 15px #facc15);">🏆</div>
            <h2 style="color:#facc15; margin-bottom: 5px;">Fase Impecável!</h2>
            <p style="color: #94a3b8; font-size: 14px;">Você não cometeu nenhum erro.</p>

            <div class="result-card">
                <div class="stat-row">
                    <span class="stat-label">💰 Moedas da Fase</span>
                    <span class="stat-value" style="color: #facc15;">+${totalGanhos}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">⭐ Bônus de Precisão</span>
                    <span class="stat-value" style="color: #10b981;">100%</span>
                </div>
            </div>

            <button class="action" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="proximaFase()">
                PRÓXIMA FASE ➔
            </button>
        </div>`;
    } else {
        html = `
        <div style="text-align:center; animation: fadeIn 0.5s ease;">
            <div style="font-size:50px; margin-bottom: 10px;">📉</div>
            <h2 style="color:#ef4444; margin-bottom: 5px;">Quase lá!</h2>
            <p style="color: #94a3b8; font-size: 14px;">Você teve ${erros} erro(s) nesta fase.</p>

            <div class="result-card">
                <div class="stat-row">
                    <span class="stat-label">💰 Moedas Acumuladas</span>
                    <span class="stat-value">${totalCoins}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">📍 Fase Atual</span>
                    <span class="stat-value">${faseAtual + 1}</span>
                </div>
            </div>

            <div class="btn-group">
                <button class="action" style="margin:0; background: #6366f1;" onclick="telaSalvarRanking()">
                    🏆 SALVAR NO RANKING
                </button>
                
                <button class="action" style="margin:0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);" onclick="tentarNovamente()">
                    🔄 TENTAR NOVAMENTE
                </button>

                <button class="action" style="margin:0; background: #00bcd4; font-size: 13px;" onclick="chamarMonetag()">
                    👀 Descobrir respostas erradas
                </button>
            </div>

            <div id="box-erros" style="display:none; margin-top: 15px; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 16px; border: 1px dashed rgba(255,255,255,0.2);">
                <p style="color: #ef4444; font-weight: bold; margin-top: 0;">Revise seus erros:</p>
                <ul id="lista-final-erros" style="font-size: 13px; color: #cbd5e1; padding-left: 20px;"></ul>
            </div>
        </div>`;
    }
    document.getElementById("quiz").innerHTML = html;
}

function chamarMonetag() {
    window.open("https://omg10.com/4/10956015", '_blank');
    const box = document.getElementById("box-erros");
    const lista = document.getElementById("lista-final-erros");
    box.style.display = "block";
    lista.innerHTML = listaDeErrosTexto.map(item => `<li>${item}</li>`).join('');
}

function tentarNovamente() { 
    totalCoins = 0; 
    document.getElementById("coinCount").innerText = totalCoins;
    carregarFase(); 
}

function proximaFase() {
    faseAtual++;
    if (faseAtual >= fases.length) {
        telaSalvarRanking();
        return;
    }
    carregarFase();
}

function verRanking() {
    const card = document.getElementById("quiz");
    card.innerHTML = "<h2>Carregando Ranking...</h2>";
    
    fetch(URL_RANKING)
    .then(r => r.json())
    .then(data => {
        let html = `<h2>🏆 TOP 5 JOGADORES</h2>`;
        
        data.slice(0,5).forEach((r, i) => {
            // AJUSTE: Adicionamos o r.categoria abaixo do nome ou ao lado
            html += `
                <div class="rank-item" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span><span class="rank-pos">${i+1}º</span> <b>${r.nome}</b></span>
                        <span style="color:#facc15; font-weight: bold;">${r.pontos} pts</span>
                    </div>
                    <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">
                        📂 Categoria: ${r.categoria || "Geral"}
                    </div>
                </div>`;
        });
        
        html += `<button class="action" onclick="location.reload()" style="margin-top:20px;">VOLTAR AO MENU</button>`;
        card.innerHTML = html;
    })
    .catch(() => {
        card.innerHTML = `<h2>Ranking Indisponível</h2><button class="action" onclick="location.reload()">VOLTAR</button>`;
    });
}

function telaSalvarRanking() {
    const completouTudo = faseAtual >= fases.length;
    const titulo = completouTudo ? "🥇 PARABÉNS!" : "🎮 FIM DE JOGO";
    const subtitulo = completouTudo 
        ? "Você completou todos os desafios!" 
        : `Você chegou até a <b>Fase ${faseAtual + 1}</b>!`;

    document.getElementById("quiz").innerHTML = `
        <div style="text-align:center;">
            <h2 style="color:#facc15; font-size:30px;">${titulo}</h2>
            <p>${subtitulo}</p>
            
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin: 15px 0;">
                <p style="font-size:14px; color: #94a3b8; margin: 0;">Sua Pontuação Final</p>
                <p style="font-size:28px; font-weight: bold; margin: 5px 0;">💰 ${totalCoins}</p>
            </div>

            <hr style="opacity:0.1; margin-bottom:20px;">
            
            <p style="font-size: 14px; margin-bottom: 10px;">Registre seu nome no Ranking Global:</p>
            <input type="text" id="nomeRanking" placeholder="Seu Nome ou Apelido" maxlength="15">
            
            <button id="btnEnviarRank" class="action" onclick="enviarParaRanking()">
                🚀 ENVIAR PONTUAÇÃO
            </button>
            
            <button class="btn-voltar" onclick="location.reload()" style="width:100%; margin-top:10px;">
                VOLTAR AO MENU
            </button>
        </div>
    `;
}

function enviarParaRanking(confirmado = false) {
    const nome = document.getElementById("nomeRanking").value;
    const btn = document.getElementById("btnEnviarRank");
    
    // AJUSTE: Garante que "Geral" seja usado apenas se categoriaAtualNome falhar
    const categoriaParaSalvar = (categoriaAtualNome && categoriaAtualNome !== "") ? categoriaAtualNome : "GERAL"; 

    if(!nome) { alert("Por favor, digite seu nome!"); return; }
    
    btn.disabled = true;
    btn.innerText = "Verificando...";

    fetch(URL_RANKING, {
        method: "POST",
        body: JSON.stringify({ 
            nome: nome, 
            pontos: totalCoins,
            categoria: categoriaParaSalvar,
            forceUpdate: confirmado 
        })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "exists") {
            const modal = document.createElement("div");
            modal.id = "modal-confirmacao";
            modal.innerHTML = `
                <h2 style="color:#facc15;">Recorde em ${categoriaParaSalvar}</h2>
                <p>O nome <b>${nome}</b> já tem pontos nesta categoria. Atualizar para <b>${totalCoins}</b>?</p>
                <div class="modal-btns">
                    <button class="btn-confirmar" id="btnSim">SIM</button>
                    <button class="btn-cancelar" id="btnNao">NÃO</button>
                </div>
            `;
            document.getElementById("quiz").appendChild(modal);

            document.getElementById("btnSim").onclick = () => { modal.remove(); enviarParaRanking(true); };
            document.getElementById("btnNao").onclick = () => { modal.remove(); btn.disabled = false; btn.innerText = "🚀 ENVIAR PONTUAÇÃO"; };
        } else {
            verRanking();
        }
    })
    .catch(() => {
        alert("Erro ao salvar. Verifique a conexão.");
        btn.disabled = false;
        btn.innerText = "🚀 ENVIAR PONTUAÇÃO";
    });
}
</script>

<!-- Novo Banner Footer -->
<div id="banner-footer" style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 320px; min-height: 50px;">
    <script>
        (function(s){
            s.dataset.zone='10982987';
            s.src='https://nap5k.com/tag.min.js';
        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))
    </script>
</div>
</script>
</body>
</html>
