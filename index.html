<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz por Fases</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    position: relative;

    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

/* overlay estilo game */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, rgba(0,0,0,0.4), rgba(0,0,0,0.9));
    z-index: -1;
}

.container {
    width: 100%;
    max-width: 480px;
    padding: 10px;
    color: white;
}

/* 🎮 topo estilo HUD */
h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.counter {
    text-align: center;
    margin-bottom: 10px;
    font-size: 14px;
    opacity: 0.9;
}

/* 🎴 card principal estilo jogo */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* 📌 fase estilo badge game */
.fase-info {
    text-align: center;
    margin-bottom: 12px;
    font-weight: bold;
    color: #facc15;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 12px;
    display: inline-block;
}

/* ⏱ timer estilo alerta */
.timer {
    color: #facc15;
    font-weight: bold;
    margin-bottom: 12px;
    text-align: center;
}

/* pergunta estilo game */
h2 {
    font-size: 18px;
    text-align: center;
    margin-bottom: 15px;
}

/* 🎮 botões estilo game mobile */
button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

/* opções */
.option {
    background: rgba(255,255,255,0.12);
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.option:hover {
    transform: scale(1.02);
    background: rgba(255,255,255,0.18);
}

/* feedback estilo game */
.correct {
    background: linear-gradient(135deg, #22c55e, #16a34a);
}

.wrong {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
}

.action {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    font-weight: bold;
}

body {
    padding-bottom: 60px;
}
/* responsivo mobile */
@media (max-width: 500px) {
    .card {
        padding: 15px;
    }

    h2 {
        font-size: 16px;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>🎯 Quiz por Fases</h1>

<div class="counter">
⏱ Tempo total: <span id="globalTime">0</span>s
</div>

<div id="quiz" class="card">Carregando...</div>

</div>

<script>

const urlFases = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbLKo7OrAuSAlaKkHIEfg2q1Vl2i-b5Jlcpm6j3-SFm68wdcAwBMWyY5uWmtbo3yIy378ApaCrgzXn/pub?gid=2042818854&single=true&output=csv";

let fases = [];
let faseAtual = 0;

let perguntas = [];
let atual = 0;
let pontos = 0;
let erros = 0;
let listaDeErrosTexto = []; // Armazena as perguntas que o usuário errou

let tempo = 15;
let timer;
let globalTime = 0;

// ⏱ contador global
setInterval(() => {
    globalTime++;
    document.getElementById("globalTime").innerText = globalTime;
}, 1000);

carregarFases();

function carregarFases() {

    fetch(urlFases)
    .then(r => r.text())
    .then(data => {

        const linhas = data.trim().split("\n").slice(1);

        fases = linhas.map(l => {
            const c = l.split(",");

            return {
                url: c[1],
                img: c[2]
            };
        });

        carregarFase();
    });
}

function carregarFase() {

    atual = 0;
    pontos = 0;
    erros = 0;
    listaDeErrosTexto = []; // Limpa os erros ao iniciar/reiniciar fase

    const fase = fases[faseAtual];

    // 🖼️ CORREÇÃO FORTE DA IMAGEM
    const img = fase.img?.trim();

    if (img && (img.includes(".jpg") || img.includes(".png") || img.includes(".jpeg") || img.includes(".webp"))) {
        document.body.style.backgroundImage = `url('${img}')`;
    } else {
        document.body.style.backgroundImage = `url('https://images.unsplash.com/photo-1529070538774-1843cb3265df')`;
    }

    fetch(fase.url)
    .then(r => r.text())
    .then(data => {

        const linhas = data.trim().split("\n").slice(1);

        perguntas = linhas.map(l => {
            const c = l.split(",");

            return {
                pergunta: c[0],
                resposta: c[1],
                opcoes: shuffle([c[1], c[2], c[3], c[4]])
            };
        });

        mostrar();
    });
}

function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

function iniciarTimer() {

    clearInterval(timer);
    tempo = 15;

    document.getElementById("timer").innerText = tempo;

    timer = setInterval(() => {

        tempo--;
        document.getElementById("timer").innerText = tempo;

        if (tempo <= 0) {
            clearInterval(timer);
            erros++;
            listaDeErrosTexto.push(perguntas[atual].pergunta); // Salva erro por tempo esgotado
            atual++;
            mostrar();
        }

    }, 1000);
}

function mostrar() {

    if (atual >= perguntas.length) {
        fim();
        return;
    }

    const totalFases = fases.length;
    const faseNum = faseAtual + 1;

    const q = perguntas[atual];

    document.getElementById("quiz").innerHTML = `
        
        <div class="fase-info">
            📌 Fase ${faseNum} / ${totalFases}
        </div>

        <div class="timer">⏳ Tempo: <span id="timer">15</span>s</div>

        <h2>${q.pergunta}</h2>

        <div id="opcoes"></div>
    `;

    iniciarTimer();

    const div = document.getElementById("opcoes");

    q.opcoes.forEach(op => {

        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = op;

        btn.onclick = () => {

            clearInterval(timer);
            document.querySelectorAll("button").forEach(b => b.disabled = true);

            if (op === q.resposta) {
                btn.classList.add("correct");
                pontos++;
            } else {
                btn.classList.add("wrong");
                erros++;
                listaDeErrosTexto.push(q.pergunta); // Salva a pergunta que errou
            }

            setTimeout(() => {
                atual++;
                mostrar();
            }, 600);
        };

        div.appendChild(btn);
    });
}

function fim() {

    let html = "";

    if (erros === 0) {
        html = `
            <h2>🏆 Fase concluída!</h2>
            <button class="action" onclick="proximaFase()">Próxima Fase</button>
        `;
    } else {
        html = `
            <h2>❌ Você errou ${erros}</h2>
            <button class="action" onclick="tentarNovamente()">Tentar Novamente</button>
            
            <div style="margin-top: 15px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
                <p style="font-size: 13px; opacity: 0.8;">Quer saber quais questões você errou?</p>
                <button class="action" style="background: #00bcd4;" onclick="chamarMonetag()">
                    📺 Ver Erros (Anúncio)
                </button>
            </div>
            
            <div id="box-erros" style="display:none; margin-top: 15px; text-align: left; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px;">
                <strong style="color: #facc15; font-size: 14px;">Questões para revisar:</strong>
                <ul id="lista-final-erros" style="padding-left: 20px; font-size: 13px; color: #ddd; margin-top: 5px;"></ul>
            </div>
        `;
    }

    document.getElementById("quiz").innerHTML = html;
}

function chamarMonetag() {
    // Link direto da Monetag fornecido
    const linkMonetag = "https://omg10.com/4/10956015"; 
    
    // Abre o anúncio em nova aba
    window.open(linkMonetag, '_blank');

    // Feedback visual e liberação dos erros após "visto"
    const btn = event.target;
    const textoOriginal = btn.innerText;
    btn.innerText = "Carregando...";
    btn.disabled = true;

    setTimeout(() => {
        const box = document.getElementById("box-erros");
        const lista = document.getElementById("lista-final-erros");
        
        if (box) {
            box.style.display = "block";
            lista.innerHTML = listaDeErrosTexto.map(item => `<li>${item}</li>`).join('');
            box.scrollIntoView({ behavior: 'smooth' });
        }
        btn.innerText = textoOriginal;
        btn.disabled = false;
    }, 2000); 
}

function tentarNovamente() {
    carregarFase();
}

function proximaFase() {

    faseAtual++;

    if (faseAtual >= fases.length) {
        document.getElementById("quiz").innerHTML = "<h2>🎉 Você zerou o jogo!</h2>";
        return;
    }

    carregarFase();
}

</script>

<!-- 🔥 BANNER RODAPÉ -->
<div id="banner-footer" style="
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: transparent;
    min-width: 320px;
    min-height: 50px;
">
    <div id="surfe-container"></div>
</div>

<script src="//static.surfe.pro/js/net.js"></script>

<script>
    function refreshSurfeBanner() {
        const container = document.getElementById('surfe-container');
        
        // 1. Limpa o conteúdo anterior
        container.innerHTML = '';

        // 2. Cria a tag <ins> do anúncio
        const ins = document.createElement('ins');
        ins.className = 'surfe-be';
        ins.setAttribute('data-sid', '420519');
        container.appendChild(ins);

        // 3. Cria e executa o script de inicialização (push)
        const scriptPush = document.createElement('script');
        scriptPush.innerHTML = '(adsurfebe = window.adsurfebe || []).push({});';
        container.appendChild(scriptPush);
    }

    // Primeira execução
    refreshSurfeBanner();

    // Atualiza a cada 30 segundos
    setInterval(refreshSurfeBanner, 30000);
</script>

<script src="https://www.highperformanceformat.com/2a5e7302edec5e07fb8153e06aa96446/invoke.js"></script>

</body>
</html>
